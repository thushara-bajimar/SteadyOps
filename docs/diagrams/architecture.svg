<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4512b"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0b0b0b">SteadyOps architecture</text>
  <text x="24" y="54" fill="#52514e">Read paths are grey. The only write path (red) passes through the safety policy engine and the supervisor's fixed operations.</text>

  <!-- Operator -->
  <rect x="24" y="80" width="190" height="62" rx="8" fill="#f4f4f1" stroke="#9a998f"/>
  <text x="119" y="106" text-anchor="middle" font-weight="700">On-call engineer</text>
  <text x="119" y="126" text-anchor="middle" fill="#52514e">browser</text>

  <!-- Dashboard -->
  <rect x="270" y="80" width="250" height="62" rx="8" fill="#e8f0fb" stroke="#2a78d6"/>
  <text x="395" y="106" text-anchor="middle" font-weight="700">Dashboard (React + Vite)</text>
  <text x="395" y="126" text-anchor="middle" fill="#52514e">8 pages, polls REST API every 2 s</text>
  <line x1="214" y1="111" x2="268" y2="111" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Control plane -->
  <rect x="24" y="170" width="620" height="420" rx="10" fill="#fbfbf9" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="40" y="196" font-weight="700" font-size="15">SteadyOps control plane (FastAPI, port 8010)</text>
  <line x1="395" y1="142" x2="395" y2="208" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="230" y="210" width="330" height="36" rx="6" fill="#ffffff" stroke="#9a998f"/>
  <text x="395" y="233" text-anchor="middle">REST API · approvals · Failure Lab · simulator</text>

  <g>
    <rect x="44" y="270" width="170" height="50" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="129" y="291" text-anchor="middle" font-weight="600">Monitoring collector</text>
    <text x="129" y="309" text-anchor="middle" fill="#52514e" font-size="11.5">health · probes · RSS/CPU</text>
    <rect x="234" y="270" width="150" height="50" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="309" y="291" text-anchor="middle" font-weight="600">Detector</text>
    <text x="309" y="309" text-anchor="middle" fill="#52514e" font-size="11.5">thresholds · dedup</text>
    <rect x="404" y="270" width="220" height="50" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="514" y="291" text-anchor="middle" font-weight="600">Evidence collector</text>
    <text x="514" y="309" text-anchor="middle" fill="#52514e" font-size="11.5">logs · changes · metrics · deps</text>
    <line x1="214" y1="295" x2="232" y2="295" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="384" y1="295" x2="402" y2="295" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="404" y="342" width="220" height="50" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="514" y="363" text-anchor="middle" font-weight="600">Root-cause engine</text>
    <text x="514" y="381" text-anchor="middle" fill="#52514e" font-size="11.5">rule-based, evidence-weighted</text>
    <line x1="514" y1="320" x2="514" y2="340" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="404" y="414" width="220" height="50" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="514" y="435" text-anchor="middle" font-weight="600">Proposal + dry run</text>
    <text x="514" y="453" text-anchor="middle" fill="#52514e" font-size="11.5">no side effects</text>
    <line x1="514" y1="392" x2="514" y2="412" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="214" y="414" width="170" height="50" rx="6" fill="#fdeee8" stroke="#c4512b" stroke-width="2"/>
    <text x="299" y="435" text-anchor="middle" font-weight="700" fill="#8a3418">Safety policy engine</text>
    <text x="299" y="453" text-anchor="middle" fill="#8a3418" font-size="11.5">final authority</text>
    <line x1="404" y1="439" x2="386" y2="439" stroke="#c4512b" stroke-width="2" marker-end="url(#r)"/>

    <rect x="44" y="414" width="150" height="50" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="119" y="435" text-anchor="middle" font-weight="600">Human approval</text>
    <text x="119" y="453" text-anchor="middle" fill="#52514e" font-size="11.5">when policy requires</text>
    <line x1="214" y1="439" x2="196" y2="439" stroke="#52514e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>

    <rect x="214" y="490" width="170" height="50" rx="6" fill="#fdeee8" stroke="#c4512b" stroke-width="2"/>
    <text x="299" y="511" text-anchor="middle" font-weight="700" fill="#8a3418">Executor</text>
    <text x="299" y="529" text-anchor="middle" fill="#8a3418" font-size="11.5">timeouts · bounded retries</text>
    <line x1="299" y1="464" x2="299" y2="488" stroke="#c4512b" stroke-width="2" marker-end="url(#r)"/>

    <rect x="404" y="490" width="220" height="50" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="514" y="511" text-anchor="middle" font-weight="600">Verifier → rollback / escalate</text>
    <text x="514" y="529" text-anchor="middle" fill="#52514e" font-size="11.5">sustained fresh observations</text>
    <line x1="384" y1="515" x2="402" y2="515" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="44" y="490" width="150" height="80" rx="6" fill="#ffffff" stroke="#9a998f"/>
    <text x="119" y="512" text-anchor="middle" font-weight="600">SQLite</text>
    <text x="119" y="530" text-anchor="middle" fill="#52514e" font-size="11.5">incidents · evidence</text>
    <text x="119" y="546" text-anchor="middle" fill="#52514e" font-size="11.5">decisions · executions</text>
    <text x="119" y="562" text-anchor="middle" fill="#52514e" font-size="11.5">hash-chained audit</text>
  </g>

  <!-- Workload -->
  <rect x="690" y="170" width="286" height="420" rx="10" fill="#f6fbf8" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="706" y="196" font-weight="700" font-size="15">Demo workload</text>
  <rect x="710" y="212" width="246" height="72" rx="6" fill="#ffffff" stroke="#c4512b" stroke-width="2"/>
  <text x="833" y="234" text-anchor="middle" font-weight="700">Supervisor (port 8100)</text>
  <text x="833" y="252" text-anchor="middle" fill="#52514e" font-size="11.5">token auth · restart · deploy known</text>
  <text x="833" y="268" text-anchor="middle" fill="#52514e" font-size="11.5">version · apply known config · no shell</text>
  <g font-size="12.5">
    <rect x="740" y="306" width="186" height="40" rx="6" fill="#ffffff" stroke="#9a998f"/><text x="833" y="331" text-anchor="middle">frontend-service :8101</text>
    <rect x="740" y="366" width="186" height="40" rx="6" fill="#ffffff" stroke="#9a998f"/><text x="833" y="391" text-anchor="middle">api-service :8102</text>
    <rect x="710" y="430" width="120" height="40" rx="6" fill="#ffffff" stroke="#9a998f"/><text x="770" y="455" text-anchor="middle">database :8103</text>
    <rect x="840" y="430" width="120" height="40" rx="6" fill="#ffffff" stroke="#9a998f"/><text x="900" y="455" text-anchor="middle">inventory :8104</text>
  </g>
  <line x1="833" y1="346" x2="833" y2="364" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="800" y1="406" x2="775" y2="428" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="866" y1="406" x2="895" y2="428" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="833" y="500" text-anchor="middle" fill="#52514e" font-size="11.5">processes owned by the supervisor</text>
  <text x="833" y="516" text-anchor="middle" fill="#52514e" font-size="11.5">JSON logs captured from stdout</text>
  <rect x="710" y="536" width="246" height="40" rx="6" fill="#fff8e6" stroke="#eda100"/>
  <text x="833" y="561" text-anchor="middle" font-size="12">Failure Lab hooks (separate chaos token)</text>

  <!-- Links between plane and workload -->
  <path d="M129 270 V258 H672 V250 H706" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="568" y="254" fill="#52514e" font-size="11">read-only GETs</text>
  <path d="M299 540 V580 H666 V272 H706" fill="none" stroke="#c4512b" stroke-width="2.2" marker-end="url(#r)"/>
  <text x="659" y="520" fill="#8a3418" font-size="11.5" font-weight="600" transform="rotate(-90 659 520)">3 fixed POST operations</text>
</svg>
