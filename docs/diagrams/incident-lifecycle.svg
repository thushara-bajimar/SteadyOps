<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0b0b0b">Incident lifecycle</text>
  <text x="24" y="54" fill="#52514e">Every transition is written to incident_events and the hash-chained audit log. Any unexpected error fails safe to escalation.</text>
  <g>
    <rect x="20"  y="84" width="118" height="58" rx="8" fill="#e8f0fb" stroke="#2a78d6"/><text x="79"  y="108" text-anchor="middle" font-weight="700">Detection</text><text x="79" y="127" text-anchor="middle" font-size="11" fill="#52514e">2 bad ticks</text>
    <rect x="158" y="84" width="118" height="58" rx="8" fill="#e8f0fb" stroke="#2a78d6"/><text x="217" y="108" text-anchor="middle" font-weight="700">Investigation</text><text x="217" y="127" text-anchor="middle" font-size="11" fill="#52514e">~12 evidence items</text>
    <rect x="296" y="84" width="118" height="58" rx="8" fill="#e8f0fb" stroke="#2a78d6"/><text x="355" y="108" text-anchor="middle" font-weight="700">Diagnosis</text><text x="355" y="127" text-anchor="middle" font-size="11" fill="#52514e">scored hypotheses</text>
    <rect x="434" y="84" width="118" height="58" rx="8" fill="#fdeee8" stroke="#c4512b" stroke-width="2"/><text x="493" y="108" text-anchor="middle" font-weight="700">Safety eval.</text><text x="493" y="127" text-anchor="middle" font-size="11" fill="#52514e">dry run + policy</text>
    <rect x="572" y="84" width="118" height="58" rx="8" fill="#e8f0fb" stroke="#2a78d6"/><text x="631" y="108" text-anchor="middle" font-weight="700">Execution</text><text x="631" y="127" text-anchor="middle" font-size="11" fill="#52514e">bounded</text>
    <rect x="710" y="84" width="118" height="58" rx="8" fill="#e8f0fb" stroke="#2a78d6"/><text x="769" y="108" text-anchor="middle" font-weight="700">Verification</text><text x="769" y="127" text-anchor="middle" font-size="11" fill="#52514e">≥4 healthy / ≥8 s</text>
    <rect x="848" y="70" width="132" height="40" rx="8" fill="#e7f6ec" stroke="#0ca30c" stroke-width="2"/><text x="914" y="95" text-anchor="middle" font-weight="700" fill="#076b07">✓ Resolved</text>
    <rect x="848" y="122" width="132" height="40" rx="8" fill="#fbe9e9" stroke="#d03b3b" stroke-width="2"/><text x="914" y="147" text-anchor="middle" font-weight="700" fill="#9c2323">✕ Escalated</text>
  </g>
  <g stroke="#52514e" stroke-width="1.6">
    <line x1="138" y1="113" x2="156" y2="113" marker-end="url(#a)"/>
    <line x1="276" y1="113" x2="294" y2="113" marker-end="url(#a)"/>
    <line x1="414" y1="113" x2="432" y2="113" marker-end="url(#a)"/>
    <line x1="552" y1="113" x2="570" y2="113" marker-end="url(#a)"/>
    <line x1="690" y1="113" x2="708" y2="113" marker-end="url(#a)"/>
    <line x1="828" y1="105" x2="846" y2="92" marker-end="url(#a)"/>
    <line x1="828" y1="121" x2="846" y2="138" marker-end="url(#a)"/>
  </g>
  <!-- branches to escalation -->
  <g stroke="#d03b3b" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
    <path d="M355 142 V250 H914 V164" marker-end="url(#a)"/>
    <path d="M470 142 V230 H880 V164"/>
    <path d="M769 142 V210 H850"/>
  </g>
  <text x="362" y="270" font-size="12" fill="#9c2323">ambiguous diagnosis / no known-good target</text>
  <text x="478" y="226" font-size="12" fill="#9c2323">policy denies / human rejects</text>
  <text x="776" y="204" font-size="12" fill="#9c2323">verification fails</text>
  <!-- approval branch -->
  <rect x="505" y="160" width="112" height="40" rx="6" fill="#fff8e6" stroke="#eda100"/>
  <text x="561" y="185" text-anchor="middle" font-size="12" font-weight="600">Awaiting approval</text>
  <line x1="590" y1="160" x2="615" y2="144" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="622" y="166" font-size="11.5" fill="#52514e">approved</text>
  <line x1="520" y1="142" x2="540" y2="158" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- rollback -->
  <rect x="620" y="282" width="360" height="36" rx="6" fill="#fff8e6" stroke="#eda100"/>
  <text x="800" y="305" text-anchor="middle" font-size="12">if health is worse than before: rollback, then escalate</text>
</svg>
